<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ccmjs Code Editor</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #203044; background: #f3f5f8; }
    body { margin: 0; }
    .demo { max-width: 960px; margin: 0 auto; padding: 48px 24px 32px; }
    .eyebrow { margin: 0 0 10px; color: #546b85; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 42px); letter-spacing: -0.035em; }
    .intro { max-width: 620px; margin: 14px 0 28px; color: #526176; line-height: 1.7; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 16px 24px; margin-bottom: 24px; }
    .controls label { display: grid; gap: 7px; font-size: 13px; font-weight: 600; }
    .controls .checkbox { display: flex; align-items: center; min-height: 40px; font-weight: 400; }
    select, button { font: inherit; border: 1px solid #bac5d2; border-radius: 6px; background: white; color: inherit; padding: 9px 12px; }
    select:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #4779b8; outline-offset: 3px; }
    button { cursor: pointer; font-size: 13px; }
    button:hover { background: #eaf0f7; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    #status { margin-left: 4px; font-size: 12px; color: #526176; }
    .hint { color: #66778b; font-size: 12px; line-height: 1.6; margin-top: 20px; }
    #error { padding: 12px; color: #971c30; background: #fff0f0; border-radius: 6px; }
    @media (max-width: 600px) { .demo { padding: 28px 16px; } .controls { gap: 12px 16px; } }
  </style>
  <script src="./libs/framework/ccm-28.0.0.min.js"></script>
</head>
<body>
  <main class="demo">
    <header>
      <p class="eyebrow">ccmjs · CodeMirror 6</p>
      <h1>Code Editor</h1>
      <p class="intro">Ein Editor für deine Programmieraufgaben. Schreiben, überarbeiten und Hinweise direkt im Code sehen.</p>
    </header>
    <div class="controls" aria-label="Editor-Einstellungen">
      <label>Beispiel
        <select id="language">
          <option value="java">Java 25</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="python">Python</option>
        </select>
      </label>
      <label>Darstellung
        <select id="theme"><option value="light">Hell</option><option value="dark">Dunkel</option></select>
      </label>
      <label class="checkbox"><input type="checkbox" id="read-only"> Schreibgeschützt</label>
      <label class="checkbox"><input type="checkbox" id="wrapping"> Zeilen umbrechen</label>
    </div>
    <div id="editor" aria-busy="true"></div>
    <div class="actions">
      <button id="diagnostic" type="button">Beispielhinweis zeigen</button>
      <button id="reset" type="button">Beispiel zurücksetzen</button>
      <span id="status" role="status"></span>
    </div>
    <p class="hint">Tab rückt ein. Escape, danach Tab verlässt den Editor. Der Code wird hier nicht ausgeführt.</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module">
    import * as configs from "./resources/configs.mjs";

    const controls = document.querySelector(".controls");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const host = document.querySelector("#editor");
    let app;
    let current = "java";
    const drafts = new Map();

    function report(cause) {
      error.textContent = cause.message;
      error.hidden = false;
    }

    async function configure() {
      controls.inert = true;
      try {
        drafts.set(current, app.getValue());
        current = document.querySelector("#language").value;
        Object.assign(app, configs[current]);
        app.value = drafts.get(current) ?? configs[current].value;
        // start() keeps the existing document; use setValue() when selecting another example.
        app.setValue(app.value, { notify: false });
        app.theme = document.querySelector("#theme").value;
        app.readOnly = document.querySelector("#read-only").checked;
        app.lineWrapping = document.querySelector("#wrapping").checked;
        app.ariaLabel = `${configs[current].label} – Quellcode`;
        await app.start();
        status.textContent = "";
      } catch (cause) { report(cause); }
      finally { controls.inert = false; }
    }

    try {
      app = await ccm.start("./ccm.code_editor.mjs", {
        ...configs.java,
        onchange: () => { status.textContent = "Geändert"; },
      }, host);
      controls.addEventListener("change", configure);
      document.querySelector("#diagnostic").addEventListener("click", () => {
        app.setDiagnostics([{ line: 1, severity: "info", message: "Beispielhinweis: Hier kann eine Meldung des Prüfservers stehen." }]);
        status.textContent = "Beispielhinweis in Zeile 1. Für Details die Markierung berühren.";
      });
      document.querySelector("#reset").addEventListener("click", () => {
        app.setValue(configs[current].value);
        status.textContent = "Beispiel zurückgesetzt";
      });
      window.addEventListener("pagehide", (event) => { if (!event.persisted) app.destroy(); });
    } catch (cause) { report(cause); }
    finally { host.setAttribute("aria-busy", "false"); }
  </script>
</body>
</html>
